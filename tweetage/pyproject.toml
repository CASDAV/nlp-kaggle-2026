[project]
name = "tweetage"
version = "0.1.0"
description = "TweetAge (Kaggle tweet-age-2026-puj): predicción de rango de edad con modelos de lenguaje propios (n-gramas), sin vectorización ni modelos preentrenados."
requires-python = ">=3.11"
# Regla de la competencia: NO agregar transformers, gensim, embeddings, TF-IDF ni modelos preentrenados.
# scikit-learn se usa solo para particiones (StratifiedGroupKFold) y métricas (F1, accuracy).
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.1",
    "pandas>=3",
    "scikit-learn>=1.5",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbstripout>=0.8",
    "nltk>=3.10.3",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
